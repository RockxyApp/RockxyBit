name: Bug report
description: Report a reproducible RockxyBit problem that is not a security vulnerability.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Use disposable sample requests. Remove credentials, private hosts, account paths, real request/response data and licence details from text and attachments. Report vulnerabilities privately."
  - type: input
    id: version
    attributes:
      label: RockxyBit version and build
      placeholder: "0.x.x (build x)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Request editing and replay
        - Response viewing
        - Collections and environments
        - Import and export
        - Rockxy integration
        - Licensing
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce with sample data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: "I removed secrets, private endpoints, account paths, real traffic, and licence details from this report and its attachments."
          required: true
